<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contacto - Código para todos </title>
    <script>
        (function () {
            if (localStorage.getItem('tema') === 'oscuro') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="../index.html">
                    <img src="../images/codigo-para-todos.jpg" alt="Logo" width="120" height="60" class="me-2">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido" aria-controls="navbarContenido" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <button id="btn-modo-oscuro" class="toggle-modo-oscuro ms-2" aria-label="Modo oscuro">🌙</button>

                <div class="collapse navbar-collapse" id="navbarContenido">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="./nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="./programas.html">Programas</a></li>
                        <li class="nav-item"><a class="nav-link" href="./contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container mt-4"> 
        <h2>Sumate como voluntario</h2>
        <p>Completa el formulario o escribinos a <a href="mailto:CodigoParaTodos@ong.com.ar">CodigoParaTodos@ong.com.ar</a></p>
     <form action="/enviar" method="post" class="container mt-4">
            <div class="mb-3">
            <label for="nombre" class="form-label"> Nombre y Apellido</label>
            <input type="text" id="nombre" name="nombre" class= "form-control" placeholder="Ej: Lucia Barrientos" required>
            </div>
             <br> 
             <div class="mb-3"> 
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" id="email" name="email"
            class="form-control"
            placeholder="tucorreo@gmail.com" required>
             </div>
             <br>
            <div class="mb-3">
            <label for="telefono" class="form-label">Telefono</label> 
            <input type="tel" name="telefono" id="telefono" class="form-control" placeholder="+5469857235" required>
            </div>
            <br>
            <div class="mb-3">
            <label for="programa" class="form-label">Motivo de contacto</label> 
            <select name="programa" id="programa" class="form-select" required>
             <option value="elegir programa"> Elegir motivo</option>
            <option value="Trabajar con nosotros"> Trabajar con nosotros</option> 
            <option value="Donaciones">Donaciones</option>
            <option value="Solicitar servicio">Solicitar Servicio</option>
            <option value="Otros">Otros</option> 
            </select>
            </div>
            <div class="mb-3">
            <label for="mensaje" class="form-label">Contanos con mas detalles</label> 
            <textarea name="mensaje" id="mensaje" class="form-control" rows="4" cols="50"  placeholder="Escribe tu mensaje aqui.." required></textarea> 
            </div>
            <br>
            <button type="submit" class="btn btn-primary">enviar</button>
        </form> 
    </main>

    <section class="redes-sociales">
        <h2>Redes sociales</h2>
        <p>Síguenos en nuestras redes sociales para estar al tanto de nuestras actividades, cursos y eventos:</p>
        <div class="iconos-redes">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="../images/iconos%20de%20redes/facebook.svg" alt="Facebook">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="../images/iconos%20de%20redes/instagram.svg" alt="Instagram">
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                <img src="../images/iconos%20de%20redes/twitter.svg" alt="Twitter">
            </a>
            <a href="https://www.whatsapp.com" target="_blank" rel="noopener noreferrer">
                <img src="../images/iconos%20de%20redes/whatsapp.svg" alt="WhatsApp">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="../images/iconos%20de%20redes/linkedin.svg" alt="LinkedIn">
            </a>
        </div>
    </section>

    <footer>
        <p> <small> Codigo para todos &copy; 2026 </small></p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script .js"></script>
    <script src="../js/contacto.js"></script>
</body>
</html>
