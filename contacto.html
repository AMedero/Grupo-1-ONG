<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=divice-width, initial-scale=1.0">
    <title> Contacto - Codigo para todos </title>
</head>
<body>
    <header>
        <img src="images/codigo-para-todos.jpg" alt="Logo" width="230" height="100">
        <h1></h1>
        <h2></h2> 
        <nav>
            <ul>
                <li><a href="./index.html">Index</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./nosotros.html">Nosotros</a></li>
                <li><a href="./programas.html">Programas</a></li>
            </ul>
        </nav>
        <link rel="stylesheet" href="css/estilos.css">
    </header>
    <main> 
        <h2>Sumate como voluntario</h2>
        <p>Completa el formulario o escribinos a <a href="">CodigoParaTodos@ong.com.ar</a></p>
     <form action="/enviar" method="post">
        <label for="nombre"> Nombre y Apellido</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Lucia Barrientos" required>
        <br>
        <label for="email">Correo Electronico</label>
        <input type="email" name="email" id="email" placeholder="tucorreo@gmail.com" required>
        <br>
        <label for="telefono">Telefono</label>
        <input type="tel" name="telefono" id="telefono" placeholder="+5469857235" required>
        <br>
        <label for="programa">Motivo de contacto</label>
        <select name="programa" id="programa" required>
            <option value="elegir programa"> Elegir motivo</option>
            <option value="Trabajar con nosotros"> Trabajar con nosotros</option>
            <option value="Donaciones">Donaciones</option>
            <option value="Solicitar servicio">Solicitar Servicio</option>
            <option value="Otros">Otros</option>
        </select>
        <label for="mensaje">Contanos con mas detalles</label>
        <textarea name="mensaje" id="mensaje" rows="4" cols="50" placeholder="Escribe tu mensaje aqui.." required></textarea>
        <br>
        <button type="submit">enviar</button>
    </form>
    </main>
    <footer>
        <p> <small> Codigo para todos &copy; 2026 </small></p>
    </footer>
    
</body>
</body>
</html>
